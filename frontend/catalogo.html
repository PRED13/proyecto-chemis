<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Granja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-[#FDFCF9] text-gray-900 font-sans">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <!-- Logo principal -->
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-950">
                <span
                    class="w-8 h-8 flex items-center justify-center bg-[#F37E58] text-white rounded-full text-lg font-serif">g</span>
                Granja Premium
            </a>

            <!-- Navegación central -->
            <div class="hidden md:flex items-center gap-8 text-sm text-gray-700">
                <a href="index.html" class="hover:text-gray-950 transition-colors">Inicio</a>
                <a href="catalogo.html" class="font-bold text-gray-950">Catálogo</a>
            </div>

            <!-- Acciones de usuario -->
            <div class="flex items-center gap-6 text-sm">
                <!-- Enlace al Carrito con Contador Dinámico -->
                <a href="carrito.html" class="relative group cursor-pointer" title="Ver carrito">
                    <svg class="w-6 h-6 text-gray-700 group-hover:text-[#D65D46] transition-colors" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    <!-- El id "carrito-count" permite que main.js actualice el número -->
                    <span id="carrito-count"
                        class="absolute -top-2 -right-3 w-5 h-5 bg-[#D65D46] text-white text-[11px] rounded-full flex items-center justify-center font-semibold hidden">0</span>
                </a>

                <!-- CONTENEDOR DINÁMICO: Se llenará mediante actualizarInterfazUsuario() en main.js -->
                <div id="auth-links" class="flex items-center gap-6">
                    <!-- Aquí aparecerán los botones de Login/Registro o el nombre del Usuario logueado -->
                </div>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <!-- Encabezado Principal -->
        <section class="mb-12">
            <p class="text-xs uppercase tracking-[0.2em] text-[#D65D46] font-semibold mb-2">INVENTARIO REAL</p>
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-gray-950 mb-4">Nuestros Ejemplares</h1>
            <p class="text-gray-600 text-lg">Selección premium gestionada desde SQL Server con actualización en tiempo
                real.</p>
        </section>

        <!-- Filtros Rápidos (Opcional para implementación futura con el backend) -->
        <div class="flex flex-wrap gap-4 mb-12">
            <button onclick="filtrar('Todos')"
                class="bg-gray-900 text-white px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider">Todos</button>
            <button onclick="filtrar('Pollos')"
                class="bg-white border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-gray-50 transition">Pollos</button>
            <button onclick="filtrar('Gallos')"
                class="bg-white border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-gray-50 transition">Gallos
                de pelea</button>
            <button onclick="filtrar('Guajolotes')"
                class="bg-white border border-gray-200 text-gray-600 px-5 py-2 rounded-full text-xs font-bold uppercase tracking-wider hover:bg-gray-50 transition">Guajolotes</button>
        </div>

        <!-- CONTENEDOR DINÁMICO (Target para main.js) -->
        <div id="contenedor-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- El contenido se genera dinámicamente mediante cargarCatalogo() en main.js -->
            <div class="col-span-full flex flex-col items-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#D65D46] mb-4"></div>
                <p class="text-gray-400 font-serif italic">Conectando con la granja...</p>
            </div>
        </div>
    </main>

    <!-- MODAL DE CANTIDAD -->
    <div id="modal-cantidad" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[100] backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 animate-in">
            
            <!-- Encabezado del Modal -->
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-950 mb-2" id="modal-titulo">
                    Selecciona cantidad
                </h2>
                <p class="text-sm text-gray-600" id="modal-subtitulo">
                    Stock disponible: <span id="modal-stock-disponible">0</span>
                </p>
            </div>

            <!-- Input de Cantidad -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    ¿Cuántas unidades deseas?
                </label>
                
                <div class="flex items-center gap-4">
                    <!-- Botón Menos -->
                    <button 
                        onclick="disminuirCantidad()" 
                        class="w-12 h-12 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-100 transition">
                        <i class="bi bi-dash-lg text-gray-700 text-xl"></i>
                    </button>

                    <!-- Input Cantidad -->
                    <input 
                        type="number" 
                        id="modal-cantidad-input" 
                        value="1" 
                        min="1" 
                        class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-lg text-center font-bold text-lg focus:border-[#D65D46] focus:outline-none"
                    >

                    <!-- Botón Más -->
                    <button 
                        onclick="aumentarCantidad()" 
                        class="w-12 h-12 rounded-lg border border-gray-200 flex items-center justify-center hover:bg-gray-100 transition">
                        <i class="bi bi-plus-lg text-gray-700 text-xl"></i>
                    </button>
                </div>

                <!-- Texto de ayuda -->
                <p class="text-xs text-gray-500 mt-3 text-center">
                    Mínimo: <span id="modal-minimo">1</span> | Máximo: <span id="modal-maximo">0</span>
                </p>
            </div>

            <!-- Botones de Acción -->
            <div class="flex gap-3">
                <button 
                    onclick="cerrarModalCantidad()" 
                    class="flex-1 py-3 rounded-lg border border-gray-200 text-gray-700 font-semibold hover:bg-gray-50 transition flex items-center justify-center gap-2">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </button>

                <button 
                    onclick="confirmarCantidad()" 
                    class="flex-1 py-3 rounded-lg bg-[#D65D46] text-white font-semibold hover:bg-[#b84d39] transition flex items-center justify-center gap-2">
                    <i class="bi bi-check-lg"></i>
                    Agregar
                </button>
            </div>

        </div>
    </div>

    <footer class="py-12 bg-white border-t border-gray-100 text-center">
        <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em]">Granja Premium © 2026 - Control de Inventario
            v1.0</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>

</html>
