<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Granja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-form { display: none; }
    </style>
</head>
<body class="bg-[#FDFCF9] text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- Header Simple -->
    <nav class="container mx-auto px-6 py-8">
        <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-950 w-fit">
            <span class="w-8 h-8 flex items-center justify-center bg-[#F37E58] text-white rounded-full text-lg font-serif">g</span>
            Granja Premium
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center px-6 pb-12">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
                <div class="p-8 md:p-10">
                    
                    <!-- SECCIÓN: INICIAR SESIÓN -->
                    <div id="login-form">
                        <h1 class="text-3xl font-serif font-bold text-gray-950 mb-2">Bienvenido</h1>
                        <p class="text-gray-500 text-sm mb-8">Ingresa tus credenciales para continuar.</p>

                        <form id="form-login-api" class="space-y-5">
                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Correo Electrónico</label>
                                <input type="email" id="login-correo" placeholder="usuario@ejemplo.com" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#D65D46] focus:ring-2 focus:ring-[#D65D46]/20 outline-none transition text-sm">
                            </div>

                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold">Contraseña</label>
                                    <a href="#" class="text-[10px] text-[#D65D46] font-bold hover:underline">¿OLVIDASTE TU CONTRASEÑA?</a>
                                </div>
                                <input type="password" id="login-password" placeholder="••••••••" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#D65D46] focus:ring-2 focus:ring-[#D65D46]/20 outline-none transition text-sm">
                            </div>

                            <button type="submit" 
                                class="w-full bg-[#D65D46] text-white py-4 rounded-xl font-bold text-sm shadow-lg shadow-[#D65D46]/20 hover:bg-[#b84d39] transition-all transform active:scale-[0.98] mt-4">
                                Iniciar Sesión
                            </button>
                        </form>

                        <div class="mt-10 pt-8 border-t border-gray-50 text-center">
                            <p class="text-sm text-gray-500">
                                ¿No tienes cuenta? 
                                <button onclick="toggleAuth()" class="text-[#D65D46] font-bold hover:underline">Regístrate aquí</button>
                            </p>
                        </div>
                    </div>

                    <!-- SECCIÓN: REGISTRO -->
                    <div id="register-form" class="hidden-form">
                        <h1 class="text-3xl font-serif font-bold text-gray-950 mb-2">Crear Cuenta</h1>
                        <p class="text-gray-500 text-sm mb-8">Únete a nuestra comunidad de granjeros.</p>

                        <form id="form-register-api" class="space-y-5">
                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Nombre Completo</label>
                                <input type="text" id="reg-nombre" placeholder="Jose Pérez" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#D65D46] focus:ring-2 focus:ring-[#D65D46]/20 outline-none transition text-sm">
                            </div>

                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Correo Electrónico</label>
                                <input type="email" id="reg-correo" placeholder="usuario@ejemplo.com" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#D65D46] focus:ring-2 focus:ring-[#D65D46]/20 outline-none transition text-sm">
                            </div>

                            <div>
                                <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2">Nueva Contraseña</label>
                                <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-[#D65D46] focus:ring-2 focus:ring-[#D65D46]/20 outline-none transition text-sm">
                            </div>

                            <button type="submit" 
                                class="w-full bg-[#D65D46] text-white py-4 rounded-xl font-bold text-sm shadow-lg shadow-[#D65D46]/20 hover:bg-[#b84d39] transition-all transform active:scale-[0.98] mt-4">
                                Crear Cuenta
                            </button>
                        </form>

                        <div class="mt-10 pt-8 border-t border-gray-50 text-center">
                            <p class="text-sm text-gray-500">
                                ¿Ya tienes cuenta? 
                                <button onclick="toggleAuth()" class="text-[#D65D46] font-bold hover:underline">Inicia sesión</button>
                            </p>
                        </div>
                    </div>

                </div>
            </div>
            <p class="text-center mt-8 text-[10px] text-gray-400 uppercase tracking-[0.2em]">
                Seguridad Encriptada SSL
            </p>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:3000/api/auth';

        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden-form');
            document.getElementById('register-form').classList.toggle('hidden-form');
        }

        // --- LÓGICA DE REGISTRO ---
        document.getElementById('form-register-api').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const correo = document.getElementById('reg-correo').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, correo, password })
                });
                const data = await res.json();

                if (data.success) {
                    alert('¡Cuenta creada con éxito! Por favor, inicia sesión.');
                    toggleAuth(); // Cambiar al formulario de login
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Servidor fuera de línea');
            }
        });

        // --- LÓGICA DE LOGIN ---
        document.getElementById('form-login-api').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('login-correo').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });
                const data = await res.json();

                if (data.success) {
                    // Guardar Token y Datos del Usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    alert(`Bienvenido de nuevo, ${data.user.nombre}`);
                    window.location.href = 'catalogo.html'; // Redirigir al éxito
                } else {
                    alert('Credenciales incorrectas');
                }
            } catch (err) {
                alert('Error al conectar con el servidor');
            }
        });
    </script>
</body>
</html>
