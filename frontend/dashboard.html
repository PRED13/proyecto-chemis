<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Compras | Granja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>

<body class="bg-[#FDFCF9] text-gray-900">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-50 shadow-sm border-b border-gray-100">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-950">
                <span
                    class="w-8 h-8 flex items-center justify-center bg-[#F37E58] text-white rounded-full text-lg font-serif">g</span>
                Granja Premium
            </a>

            <div class="flex items-center gap-6">
                <a href="catalogo.html" class="text-sm font-medium hover:text-[#D65D46] transition">
                    Volver al catálogo
                </a>

                <button onclick="logout()"
                    class="text-sm text-red-500 hover:text-red-700 font-medium flex items-center gap-2 transition">
                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar sesión
                </button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <!-- Encabezado -->
        <section class="mb-12">
            <p class="text-xs uppercase tracking-[0.2em] text-[#D65D46] font-semibold mb-2">HISTORIAL</p>
            <h1 class="text-4xl md:text-5xl font-serif font-bold text-gray-950 mb-4">Mis Compras</h1>
            <p class="text-gray-600 text-lg">Visualiza todas tus transacciones y descargas de notas de remisión.</p>
        </section>

        <!-- Contenedor de historial -->
        <div id="historial-container" class="space-y-6">
            <!-- Cargando historial... -->
            <div class="flex flex-col items-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#D65D46] mb-4"></div>
                <p class="text-gray-400 font-serif italic">Cargando tu historial...</p>
            </div>
        </div>
    </main>

    <footer class="py-12 bg-white border-t border-gray-100 text-center mt-20">
        <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em]">Granja Premium © 2026 - Historial de Compras</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
    <!-- jQuery y Toastr -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
        toastr.options = {
            "closeButton": true,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "timeOut": "3000"
        };
    </script>
</body>

</html>
