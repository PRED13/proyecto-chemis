<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Granja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Header (Sincronizado con el Catálogo) -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-950">
                <span class="w-8 h-8 flex items-center justify-center bg-[#F37E58] text-white rounded-full text-lg font-serif">g</span>
                Granja Premium
            </a>
            <div class="flex items-center gap-6">
                <!-- Contador de productos en el header -->
                <div class="relative group cursor-pointer mr-4">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <span class="absolute -top-2 -right-3 w-5 h-5 bg-[#D65D46] text-white text-[11px] rounded-full flex items-center justify-center font-semibold hidden">0</span>
                </div>
                <a href="catalogo.html" class="text-sm font-medium hover:text-[#D65D46] transition">Volver al Catálogo</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-gray-950 mb-8 border-b pb-4">Tu Carrito</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Lista de Productos Dinámica -->
            <div class="lg:col-span-2 space-y-6">
                <div id="items-carrito" class="space-y-4">
                    <!-- Se llena automáticamente con carrito.js -->
                </div>
                
                <!-- Botón para volver si el carrito está vacío (controlado por JS) -->
                <div id="empty-cart-action" class="hidden text-center py-10">
                    <a href="catalogo.html" class="inline-block bg-gray-900 text-white px-8 py-3 rounded-xl hover:bg-gray-800 transition">Explorar Catálogo</a>
                </div>
            </div>

            <!-- Resumen de Pedido -->
            <aside class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 h-fit sticky top-24">
                <h2 class="text-xl font-bold mb-6">Resumen del pedido</h2>
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Subtotal</span>
                        <span class="font-medium">$<span id="subtotal-precio">0.00</span></span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>Envío</span>
                        <span class="text-green-600 font-medium">Gratis</span>
                    </div>
                    <hr class="border-gray-100">
                    <div class="flex justify-between text-2xl font-bold text-gray-950">
                        <span>Total</span>
                        <span class="text-[#D65D46]">$<span id="total-precio">0.00</span> <small class="text-[10px] text-gray-400">MXN</small></span>
                    </div>
                </div>
                <button onclick="procesarCompra()" class="w-full bg-[#D65D46] text-white py-4 rounded-xl font-bold hover:bg-[#b84d39] transition shadow-lg shadow-orange-100">
                    Finalizar Compra
                </button>
                <p class="text-xs text-gray-400 text-center mt-4 uppercase tracking-wider">Pago seguro encriptado</p>
            </aside>
        </div>
    </main>

    <!-- Scripts de funcionalidad -->
    <script src="js/main.js"></script> <!-- Mantiene el contador del header sincronizado -->
    <script src="js/carrito.js"></script> <!-- Gestiona la lógica de la lista y totales -->

    <script>
        // Función adicional para conectar con el resumen del aside
        async function procesarCompra() {
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            // Calculamos el total
            const total = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            const datosVenta = {
                total: total,
                items: carrito
            };

            try {
                const response = await fetch('http://localhost:3000/api/ventas/completar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosVenta)
                });

                const resultado = await response.json();

                if (resultado.success) {
                    alert("¡Compra realizada con éxito! Folio: " + resultado.ventaId);
                    localStorage.removeItem('carrito'); // Limpiar carrito
                    window.location.href = 'index.html'; // Redirigir
                } else {
                    alert("Error: " + resultado.message);
                }
            } catch (error) {
                console.error("Error al enviar la venta:", error);
                alert("No se pudo conectar con el servidor.");
            }
        }
    </script>
</body>
</html>
