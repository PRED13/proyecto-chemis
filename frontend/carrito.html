<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Granja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <!-- Logo -->
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-950">
                <span class="w-8 h-8 flex items-center justify-center bg-[#F37E58] text-white rounded-full text-lg font-serif">g</span>
                Granja Premium
            </a>

            <!-- Acciones y Estado de Sesión -->
            <div class="flex items-center gap-8">
                <a href="catalogo.html" class="text-sm font-medium hover:text-[#D65D46] transition">Volver al Catálogo</a>
                <!-- CONTENEDOR DINÁMICO: Aquí aparecerá "Hola, [Nombre]" o los botones de Login -->
                <div id="auth-links" class="flex items-center gap-6 text-sm">
                    <!-- Inyectado por js/main.js -->
                </div>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-gray-950 mb-8 border-b pb-4">Tu Carrito</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Lista de Productos -->
            <div class="lg:col-span-2 space-y-6">
                <div id="items-carrito" class="space-y-4">
                    <!-- Renderizado por js/carrito.js -->
                </div>
            </div>

            <!-- Resumen de Pedido -->
            <aside class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 h-fit sticky top-24">
                <h2 class="text-xl font-bold mb-6">Resumen del pedido</h2>
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Envío</span>
                        <span class="text-green-600 font-medium">Gratis</span>
                    </div>
                    <hr class="border-gray-100">
                    <div class="flex justify-between text-2xl font-bold text-gray-950">
                        <span>Total</span>
                        <span class="text-[#D65D46]">$<span id="total-precio">0.00</span></span>
                    </div>
                </div>
                
                <!-- IMPORTANTE: Nombre de función cambiado a finalizarCompra() -->
                <button onclick="finalizarCompra()" class="w-full bg-[#D65D46] text-white py-4 rounded-xl font-bold hover:bg-[#b84d39] transition shadow-lg shadow-orange-100">
                    Finalizar Compra
                </button>
                
                <p class="text-xs text-gray-400 text-center mt-4 uppercase tracking-wider">Pago seguro encriptado</p>
            </aside>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/carrito.js"></script>
    <!-- Dependencias: jQuery y Toastr JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
     // Configuración global de Toastr
        toastr.options = {
            "closeButton": true,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "timeOut": "3000"
        };
    </script>
</body>
</html>
