<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Granja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Header (Sincronizado con el Catálogo) -->
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-gray-950">
                <span class="w-8 h-8 flex items-center justify-center bg-[#F37E58] text-white rounded-full text-lg font-serif">g</span>
                Granja Premium
            </a>
            <div class="flex items-center gap-6">
                <a href="catalogo.html" class="text-sm font-medium hover:text-[#D65D46] transition">Volver al Catálogo</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold text-gray-950 mb-8 border-b pb-4">Tu Carrito</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Lista de Productos -->
            <div class="lg:col-span-2 space-y-6" id="cart-container">
                <!-- Los productos se renderizarán aquí mediante JS -->
                
                <!-- Estado Vacío (Fallback) -->
                <div id="empty-cart-msg" class="hidden text-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                    <p class="text-gray-500 mb-4">No hay productos en tu carrito todavía.</p>
                    <a href="catalogo.html" class="inline-block bg-[#D65D46] text-white px-6 py-2 rounded-lg hover:bg-[#b84d39] transition">Ir a comprar</a>
                </div>
            </div>

            <!-- Resumen de Pedido -->
            <aside class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 h-fit sticky top-24">
                <h2 class="text-xl font-bold mb-6">Resumen del pedido</h2>
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>Envío</span>
                        <span class="text-green-600 font-medium">Gratis</span>
                    </div>
                    <hr class="border-gray-100">
                    <div class="flex justify-between text-lg font-bold text-gray-950">
                        <span>Total</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>
                <button class="w-full bg-[#D65D46] text-white py-4 rounded-xl font-bold hover:bg-[#b84d39] transition shadow-lg shadow-orange-100">
                    Finalizar Compra
                </button>
                <p class="text-xs text-gray-400 text-center mt-4 uppercase tracking-wider">Pago seguro encriptado</p>
            </aside>
        </div>
    </main>

    <script>
        // Simulación de datos (En producción vendría de LocalStorage)
        let cartItems = [
            { id: 1, name: "Huevos Orgánicos (Docena)", price: 4.50, qty: 2, img: "https://images.unsplash.com/photo-1516734439911-37090875e533?auto=format&fit=crop&q=80&w=200" },
            { id: 2, name: "Leche Fresca 1L", price: 2.80, qty: 1, img: "https://images.unsplash.com/photo-1550583724-1255818c053b?auto=format&fit=crop&q=80&w=200" }
        ];

        function renderCart() {
            const container = document.getElementById('cart-container');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            if (cartItems.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }

            container.innerHTML = cartItems.map(item => `
                <div class="flex items-center gap-6 bg-white p-6 rounded-2xl border border-gray-100 hover:shadow-md transition">
                    <img src="${item.img}" alt="${item.name}" class="w-24 h-24 object-cover rounded-xl">
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-950">${item.name}</h3>
                        <p class="text-sm text-gray-500 mb-2">Precio unitario: $${item.price.toFixed(2)}</p>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                                <button onclick="updateQty(${item.id}, -1)" class="px-3 py-1 hover:bg-gray-50">-</button>
                                <span class="px-3 py-1 text-sm font-medium border-x border-gray-200">${item.qty}</span>
                                <button onclick="updateQty(${item.id}, 1)" class="px-3 py-1 hover:bg-gray-50">+</button>
                            </div>
                            <button onclick="removeItem(${item.id})" class="text-xs text-red-500 font-medium hover:underline">Eliminar</button>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-gray-950">$${(item.price * item.qty).toFixed(2)}</p>
                    </div>
                </div>
            `).join('');

            updateTotals();
        }

        function updateQty(id, delta) {
            const item = cartItems.find(i => i.id === id);
            if (item) {
                item.qty = Math.max(1, item.qty + delta);
                renderCart();
            }
        }

        function removeItem(id) {
            cartItems = cartItems.filter(i => i.id !== id);
            renderCart();
        }

        function updateTotals() {
            const subtotal = cartItems.reduce((acc, item) => acc + (item.price * item.qty), 0);
            document.getElementById('subtotal').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('total').innerText = `$${subtotal.toFixed(2)}`;
        }

        // Inicialización
        renderCart();
    </script>
</body>
</html>
